aid: topia
name: Topia
description: 'Topia is a global mobility platform for distributed workforces, used
  by HR, Finance and Legal teams at mid-market and enterprise companies to manage international
  assignments, relocations, business travel, remote work and cross-border compliance
  across 190+ countries in a single system. Founded in 2010 and headquartered in the
  United States, with additional offices in the United Kingdom, Ireland and Estonia,
  Topia spans global talent mobility, a tax and compliance engine, cost estimation
  and tracking, global workforce planning, cost and immigration risk management, and
  business travel. In April 2026 Topia launched Horizon, an agentic AI workspace for
  mobility teams that the company describes as built natively into MCP (Model Context
  Protocol) environments. Topia integrates with HRIS, payroll, travel and expense systems
  including Workday (a Workday Approved Integration), SAP, ADP, Oracle, Ceridian, SAP
  Concur and BCD Travel. Topia publishes an llms.txt at its marketing host, but no
  public developer portal, API reference or machine-readable specification; the support
  center sits behind a customer login.'
